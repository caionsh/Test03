<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Beatriz - Entrada</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to bottom right, #6a1b9a, #ab47bc);
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
      border: 2px solid white;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    button {
      background-color: #ab47bc;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #6a1b9a;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bem-vinda, Beatriz</h1>
    <p>Este site foi feito especialmente para você. Deseja entrar?</p>
    <button onclick="window.location.href='index.html'">Entrar</button>
  </div>
</body>
</html>
